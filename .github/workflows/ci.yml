name: Build & Test

on:
  pull_request:
    branches: [main]

# A second push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx prisma generate

      - run: npm test

      # Next reuses its compiler cache across builds when it is given one.
      # This build is the plain one, with no NEXT_PUBLIC_APP_URL override, so
      # it keeps its own entry rather than sharing the e2e job's.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-ci-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-ci-${{ hashFiles('package-lock.json') }}-
            next-ci-

      - run: npm run build

  finance-ledger:
    name: Cash ledger PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://finance:finance@127.0.0.1:5432/finance_test
      FINANCE_TEST_DATABASE_URL: postgresql://finance:finance@127.0.0.1:5432/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx vitest run src/__tests__/features/finance
