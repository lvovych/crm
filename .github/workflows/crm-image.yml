name: CRM release image
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      image:
        description: Immutable ARM64 image reference for Hetzner CAX21
        value: ${{ jobs.build.outputs.image }}
permissions:
  contents: read
  packages: write
jobs:
  build:
    # Production runs on Hetzner CAX21 (Ampere / ARM64).
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.reference.outputs.image }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/lvovych/crm:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
            ghcr.io/lvovych/crm:${{ inputs.version }}
          build-args: APP_VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=crm-arm64
          cache-to: type=gha,mode=max,scope=crm-arm64
      - name: Export immutable image reference
        id: reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=ghcr.io/lvovych/crm@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$VERSION: ghcr.io/lvovych/crm@$DIGEST (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
