name: CRM production image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.md'
      - '.github/workflows/crm-health.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: crm-image
  cancel-in-progress: false
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/lvovych/crm:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: APP_VERSION=crm-${{ github.sha }}
          cache-from: type=gha,scope=crm-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=crm-${{ matrix.arch }}
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/lvovych/crm@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi architecture image
        env:
          IMAGE: ghcr.io/lvovych/crm
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$SHA" "$IMAGE:sha-$SHA-amd64" "$IMAGE:sha-$SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$SHA" >> "$GITHUB_STEP_SUMMARY"
