name: CRM production image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/**'
      - '**.md'
permissions:
  contents: read
  packages: write
concurrency:
  group: crm-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lvovych/crm:sha-${{ github.sha }}
          build-args: APP_VERSION=crm-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/lvovych/crm@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
