name: CRM release and production deploy

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crm-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'lvovych/crm' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch current main and tag refs
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
      - name: Validate release provenance
        id: release
        run: python3 scripts/release/validate.py

  configuration:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require production SSH configuration before building
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo '::error::Set production secret CRM_DEPLOY_HOST'; exit 1; }
          test -n "$DEPLOY_KEY" || { echo '::error::Set production secret CRM_DEPLOY_SSH_KEY'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo '::error::Set production secret CRM_DEPLOY_KNOWN_HOSTS'; exit 1; }

  test:
    needs: [validate, configuration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test -- --maxWorkers=4

  image:
    needs: [validate, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/crm-image.yml
    with:
      sha: ${{ needs.validate.outputs.sha }}
      version: ${{ needs.validate.outputs.tag }}

  deploy:
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://crm.srv.lauto.com.ua
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag and release before accessing production
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          current = json.loads(Path(os.environ['RUNNER_TEMP'], 'release.json').read_text())
          assert current['id'] == event['release']['id'], 'Release was replaced'
          event['release'] = current
          Path(os.environ['GITHUB_EVENT_PATH']).write_text(json.dumps(event))
          PY
          python3 scripts/release/validate.py
      - name: Deploy the tested digest over verified SSH
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CRM_DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/lvovych/crm@sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          install -d -m 700 "$RUNNER_TEMP/crm-ssh"
          trap 'rm -rf "$RUNNER_TEMP/crm-ssh"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/crm-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/crm-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/crm-ssh/"*
          { printf '%s\n' "$GH_TOKEN"; cat scripts/release/deploy.sh; } | \
            ssh -T -i "$RUNNER_TEMP/crm-ssh/key" -o IdentitiesOnly=yes \
              -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/crm-ssh/known_hosts" \
              "root@$DEPLOY_HOST" \
              "read -r REGISTRY_TOKEN; export REGISTRY_TOKEN; bash -s -- '$IMAGE' '$RELEASE_TAG' '$GITHUB_ACTOR'"
      - name: Verify public HTTPS health
        run: curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 10 https://crm.srv.lauto.com.ua/api/v1/health
