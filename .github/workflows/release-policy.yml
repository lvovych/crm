name: Release policy checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'scripts/release/**'
      - 'infra/deploy-runner/**'
      - 'infra/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'scripts/release/**'
      - 'infra/deploy-runner/**'
      - 'infra/terraform/**'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise release guards and deployment failure handling
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check shell syntax
        run: |
          bash -n scripts/release/deploy.sh
          bash -n infra/deploy-runner/install.sh
          bash -n infra/deploy-runner/register.sh
      - name: Validate Actions configuration
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= \
            .github/workflows/deploy-prod.yml .github/workflows/crm-image.yml \
            .github/workflows/release-policy.yml
