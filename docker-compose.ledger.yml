name: crm-ledger-acceptance
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: crm_ledger_test
    ports: ["127.0.0.1:55440:5432"]
    volumes: ["ledger-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_test -d crm_ledger_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.ledger
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm_test:local_test_only@db:5432/crm_ledger_test
      BETTER_AUTH_SECRET: isolated-docker-acceptance-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://localhost:3097
      STOCK_LEDGER_ENABLED: "true"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=6144
      DATA_ROOT: /app/data
    ports: ["127.0.0.1:3097:3000"]
    volumes: ["ledger-uploads:/app/data/uploads"]
volumes:
  ledger-db:
  ledger-uploads:
