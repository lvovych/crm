---
- name: Configure basic production safeguards
  hosts: crm
  become: true
  tasks:
    - name: Install security updates and diagnostics
      ansible.builtin.apt:
        name: [unattended-upgrades, curl]
        state: present
    - name: Enable automatic security updates without automatic reboot
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52crm-unattended
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          Unattended-Upgrade::Automatic-Reboot "false";
    - name: Configure key-only SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-crm.conf
        mode: '0644'
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
      notify: Reload SSH
    - name: Allocate swap file
      ansible.builtin.command: dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
      args:
        creates: /swapfile
      register: swap_created
    - name: Restrict swap permissions
      ansible.builtin.file:
        path: /swapfile
        mode: '0600'
    - name: Format swap
      ansible.builtin.command: mkswap /swapfile
      when: swap_created.changed
    - name: Persist swap
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0
    - name: Check active swap
      ansible.builtin.command: swapon --show=NAME --noheadings
      changed_when: false
      register: active_swap
    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in active_swap.stdout"
    - name: Set low swappiness
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-crm.conf
        mode: '0644'
        content: "vm.swappiness=10\n"
      notify: Apply sysctl
  handlers:
    - name: Reload SSH
      ansible.builtin.shell: /usr/sbin/sshd -t && systemctl reload ssh
    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-crm.conf
