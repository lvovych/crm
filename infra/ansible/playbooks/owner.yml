---
- name: Bootstrap the authorized CEO account
  hosts: crm
  become: true
  vars_files:
    - ../group_vars/all/main.yml
  vars:
    owner_login: "{{ lookup('file', '../../.secrets/ceo-login.json') | from_json }}"
  tasks:
    - name: Check whether the owner already exists
      ansible.builtin.command:
        argv: [docker, compose, exec, '-T', db, psql, '-U', crm, '-d', crm, '-tAc', "SELECT count(*) FROM users WHERE email='ceo@lauto.com.ua'"]
      args:
        chdir: "{{ crm_root }}"
      register: owner_count
      changed_when: false
    - name: Register the owner through the application authentication API
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/public/auth/sign-up/email
        method: POST
        headers:
          Origin: "https://{{ crm_domain }}"
        body_format: json
        body:
          name: LAUTO CEO
          email: "{{ owner_login.email }}"
          password: "{{ owner_login.password }}"
        status_code: [200, 201]
      when: owner_count.stdout | trim == '0'
      no_log: true
    - name: Configure owner membership and close public registration
      ansible.builtin.command:
        argv: [docker, compose, exec, '-T', app, node]
        stdin: "{{ lookup('file', '../files/bootstrap-owner.cjs') }}"
      args:
        chdir: "{{ crm_root }}"
      changed_when: true
    - name: Verify password authentication
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/public/auth/sign-in/email
        method: POST
        headers:
          Origin: "https://{{ crm_domain }}"
        body_format: json
        body:
          email: "{{ owner_login.email }}"
          password: "{{ owner_login.password }}"
        status_code: 200
      no_log: true
